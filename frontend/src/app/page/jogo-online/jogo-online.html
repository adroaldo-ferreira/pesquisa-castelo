<div class="container-40">
  <app-grafico-setor [list]="lista"></app-grafico-setor>
</div>

<div class="container">
  <h1>Jogo Online</h1>

  <table class="table table-striped table-hover table-bordered table-sm">
    <thead>
      <tr>
        <th scope="col">Nome do jogo</th>
        <th scope="col">Quantidade</th>
        <th scope="col">Percentual</th>
      </tr>
    </thead>
    <tbody>
      @for (cat of lista; track cat.resposta) {
      <tr>
        <td class="text-muted fw-semibold">{{cat.resposta}}</td>
        <td class="fw-medium">{{cat.quantidade}}</td>
        <td class="text-muted">{{(cat.quantidade / quantidade * 100).toFixed(2) }}%</td>
      </tr>
      }
      @empty {
      <tr>
        <td colspan="13" class="text-center py-5 text-muted">
          <div class="fw-semibold">Nenhuma categoria encontrada</div>
          <small>Não há respostas para exibir no momento.</small>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
